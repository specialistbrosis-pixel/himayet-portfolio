name: Deploy portfolio and Hazi Store 2

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Prepare static websites
        shell: bash
        run: |
          set -e
          mkdir -p _site /tmp/hazi-store
          rsync -a --exclude='.git/' --exclude='hazi-store-2/' --exclude='_site/' ./ _site/
          base64 -d hazi-store-2/site-bundle.zip.b64 > /tmp/hazi-store-bundle.zip
          unzip -Z1 /tmp/hazi-store-bundle.zip | while IFS= read -r entry; do
            case "$entry" in
              hazi_store_2/*)
                target="/tmp/hazi-store/${entry#hazi_store_2/}"
                mkdir -p "$(dirname "$target")"
                if ! unzip -p /tmp/hazi-store-bundle.zip "$entry" > "$target"; then
                  rm -f "$target"
                  echo "Skipping damaged archive entry: $entry"
                fi
                ;;
            esac
          done
          test -s /tmp/hazi-store/index.html
          cp -R /tmp/hazi-store/. _site/hazi-store-2/
          test -s _site/hazi-store-2/index.html
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload files
        uses: actions/upload-pages-artifact@v3
        with:
          path: "_site"
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
